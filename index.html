<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homys — Premium Vacation Rentals in Egypt</title>
    <meta name="description" content="Homys offers hand-picked, hotel-grade vacation rentals across Egypt's finest destinations — Sahel, Gouna, Cairo, and the Red Sea." />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn previews) -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://homys.com/" />
    <meta property="og:title"       content="Homys — Premium Vacation Rentals in Egypt" />
    <meta property="og:description" content="Hand-picked, hotel-grade stays across Egypt's finest destinations. Sahel, Gouna, Cairo, Red Sea." />
    <meta property="og:image"       content="https://res.cloudinary.com/dzpswgjsm/image/upload/f_auto,q_auto,w_1200/homys-static/hero.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Homys — Premium Vacation Rentals in Egypt" />
    <meta name="twitter:description" content="Hand-picked, hotel-grade stays across Egypt's finest destinations." />
    <meta name="twitter:image"       content="https://res.cloudinary.com/dzpswgjsm/image/upload/f_auto,q_auto,w_1200/homys-static/hero.png" />

    <!-- Preconnect to Google Fonts for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Single consolidated Google Fonts load (replaces 21 duplicate @import calls) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Encode+Sans+Expanded:wght@100;200;300;400;500;600;700;800;900&family=Libre+Baskerville:wght@400;700&family=Roboto:wght@300;400&display=swap"
      rel="stylesheet"
    />

    <!-- Instant background color while bg.png loads -->
    <style>
      body {
        margin: 0;
        background-color: #eee9d5;
        font-family: 'Encode Sans Expanded', sans-serif;
      }
    </style>
  </head>

    <script type="module" src="/src/main.jsx"></script>

</html>
